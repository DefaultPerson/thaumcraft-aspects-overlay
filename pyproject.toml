[project]
name = "aspects-overlay"
version = "0.1.0"
description = "Thaumcraft 4 research solver and auto-placement overlay for Minecraft on Linux/Gamescope"
readme = "README.md"
keywords = ["minecraft", "thaumcraft", "research", "aspects", "overlay", "gamescope"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.10,<6",
  "ortools>=9.12,<10",
  "Pillow>=11,<14",
  "PySide6-Essentials>=6.8,<7; sys_platform == 'linux'",
  "python-xlib==0.33; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/DefaultPerson/thaumcraft-aspects-overlay"
Issues = "https://github.com/DefaultPerson/thaumcraft-aspects-overlay/issues"

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
aspects-overlay = "aspects_overlay.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aspects_overlay*"]

[tool.setuptools.package-data]
aspects_overlay = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
